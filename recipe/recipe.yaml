schema_version: 1

context:
  version: "1.0.2"

package:
  name: pystac-ext-mgrs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-mgrs/pystac_ext_mgrs-${{ version }}.tar.gz
  sha256: 8251de11138bd9dcc8fc757d5b28eafdfd6991f827e8e64745637886ecb26a92

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.mgrs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: MGRS extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-mgrs/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
